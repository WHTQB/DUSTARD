<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DUSTARD</title>
    <link rel="icon" type="image/x-icon" href="dustardico.ico">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: #000000;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .coming-soon {
            font-family: 'Impact', 'Arial Black', 'Helvetica', sans-serif;
            font-weight: bold;
            text-align: center;
            letter-spacing: 2px;
            text-transform: uppercase;
            padding: 0 20px;
            user-select: none;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .coming-soon .title {
            font-size: 90px;
            display: block;
            color: #ff0000;
        }

        .coming-soon .subtitle {
            position: relative;
            display: block;
            font-size: 16px;
            color: #ffffff;
            animation: distort 0.4167s steps(5, end) infinite;
        }

        .coming-soon .subtitle::before,
        .coming-soon .subtitle::after {
            content: attr(data-text);
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000000;
            overflow: hidden;
            display: block;
        }

        .coming-soon .subtitle::before {
            color: #ffffff;
            z-index: -1;
            animation: glitch-white 0.5s infinite linear alternate-reverse;
            text-shadow: 2px 0 #ffffff;
        }

        .coming-soon .subtitle::after {
            color: #888888;
            z-index: -2;
            animation: glitch-gray 0.3333s infinite linear alternate-reverse;
            text-shadow: -2px 0 #888888;
        }

        @keyframes distort {
            0%   { transform: skewX(0deg)       scale(1, 1); }
            10%  { transform: skewX(-2.1deg)    scale(1.0105, 0.9895); }
            20%  { transform: skewX(1.5deg)     scale(0.9895, 1.0105); }
            30%  { transform: skewX(-0.9deg)    scale(1.0105, 0.9895); }
            40%  { transform: skewX(2.1deg)     scale(0.9895, 1.0105); }
            50%  { transform: skewX(-1.8deg)    scale(1.0105, 0.9895); }
            60%  { transform: skewX(0.6deg)     scale(0.9895, 1.0105); }
            70%  { transform: skewX(-2.1deg)    scale(1.0105, 0.9895); }
            80%  { transform: skewX(1.2deg)     scale(0.9895, 1.0105); }
            90%  { transform: skewX(-1.5deg)    scale(1.0105, 0.9895); }
            100% { transform: skewX(0deg)       scale(1, 1); }
        }

        @keyframes glitch-white {
            0% {
                transform: translate(0, 0);
                clip-path: inset(0 0 0 0);
                opacity: 0.8;
            }
            15% {
                transform: translate(-3px, 1px);
                clip-path: inset(10% 0 60% 0);
                opacity: 0.9;
            }
            30% {
                transform: translate(3px, -1px);
                clip-path: inset(50% 0 20% 0);
                opacity: 0.7;
            }
            45% {
                transform: translate(-2px, 2px);
                clip-path: inset(25% 0 45% 0);
                opacity: 0.9;
            }
            60% {
                transform: translate(2px, 0);
                clip-path: inset(70% 0 10% 0);
                opacity: 0.6;
            }
            75% {
                transform: translate(-4px, -2px);
                clip-path: inset(5% 0 75% 0);
                opacity: 0.85;
            }
            100% {
                transform: translate(0, 0);
                clip-path: inset(0 0 0 0);
                opacity: 0.8;
            }
        }

        @keyframes glitch-gray {
            0% {
                transform: translate(0, 0);
                clip-path: inset(0 0 0 0);
                opacity: 0.7;
            }
            12% {
                transform: translate(4px, -2px);
                clip-path: inset(35% 0 40% 0);
                opacity: 0.9;
            }
            25% {
                transform: translate(-3px, 1px);
                clip-path: inset(65% 0 15% 0);
                opacity: 0.6;
            }
            37% {
                transform: translate(2px, -3px);
                clip-path: inset(15% 0 70% 0);
                opacity: 0.85;
            }
            50% {
                transform: translate(-4px, 2px);
                clip-path: inset(45% 0 30% 0);
                opacity: 0.75;
            }
            62% {
                transform: translate(3px, 1px);
                clip-path: inset(80% 0 5% 0);
                opacity: 0.5;
            }
            75% {
                transform: translate(-1px, -1px);
                clip-path: inset(20% 0 60% 0);
                opacity: 0.9;
            }
            87% {
                transform: translate(3px, 2px);
                clip-path: inset(55% 0 25% 0);
                opacity: 0.7;
            }
            100% {
                transform: translate(0, 0);
                clip-path: inset(0 0 0 0);
                opacity: 0.7;
            }
        }
    </style>
</head>
<body>
    <!-- мы работаем над своей небольшой игрой, спасибо если ждешь -->
    <audio autoplay loop>
        <source src="mainmenu.mp3" type="audio/mpeg">
    </audio>
    <div class="coming-soon">
        <span class="title">DUSTARD</span>
        <span class="subtitle" data-text="COMING SOON">COMING SOON</span>
    </div>
    <script>
        (function () {
            var audio = document.querySelector('audio');
            if (!audio) return;

            function tryPlay() {
                audio.play().then(function () {
                    document.removeEventListener('click', tryPlay);
                    document.removeEventListener('keydown', tryPlay);
                    document.removeEventListener('touchstart', tryPlay);
                }).catch(function () {
                });
            }

            tryPlay();
            document.addEventListener('click', tryPlay);
            document.addEventListener('keydown', tryPlay);
            document.addEventListener('touchstart', tryPlay);
        })();
    </script>
</body>
</html>
